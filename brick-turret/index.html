<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>회전포 벽돌깨기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* layout: one-screen portrait game. HUD on top, board centered, ability slots below.
   deliberately single-theme (dark ink board): the game commits to one look. */
:root{
  color-scheme: dark;
  --bg:#12152e; --panel:#1b2044; --line:#2d3466; --fg:#eeebfb; --muted:#9b9ec9;
  --accent:#ffc857; --mint:#5eead4; --danger:#ff6b81; --ink:#0e1230;
  --font-display:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#hud,#slots{width:var(--bw,360px);flex:none}
#hud{display:flex;align-items:center;gap:10px}
.lv{font-family:var(--font-display);font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv small{color:var(--muted);font-size:12px;margin-right:4px;letter-spacing:.08em}
.xp{flex:1;height:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--accent)}
.hp{display:flex;gap:4px}
.hp b{width:12px;height:12px;border-radius:3px;background:var(--danger)}
.hp b.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#board{position:relative;width:var(--bw,360px);height:var(--bh,640px);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:10px;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:rgba(14,18,48,.86);border-radius:10px;text-align:center}
#ov[hidden]{display:none}
h1{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0;letter-spacing:.02em}
h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
.stat{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-display);font-size:20px;padding:10px 30px;border-radius:10px;border:0;background:var(--accent);color:var(--ink);cursor:pointer}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.cards{display:flex;flex-direction:column;gap:10px;width:100%}
.card{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);cursor:pointer;font-family:var(--font-body)}
.card:hover{border-color:var(--accent)}
.chip{grid-row:span 2;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:var(--ink)}
.card .t{font-family:var(--font-display);font-size:18px}
.card .t em{font-style:normal;color:var(--accent);font-size:13px;margin-left:8px;font-family:var(--font-body)}
.card .d{font-size:12.5px;color:var(--muted);line-height:1.45}
.hint{font-size:12px;color:var(--muted);margin:0}
#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;min-height:46px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.slot .n{font-family:var(--font-display);font-size:15px;line-height:1;color:var(--c,var(--fg))}
.slot.empty .n{color:var(--muted);font-size:12px;font-family:var(--font-body)}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--c,var(--accent))}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="lv"><small>LV</small><span id="lv">1</span></div>
    <div class="xp"><i id="xpb"></i></div>
    <div class="hp" id="hp" aria-label="체력"></div>
  </header>
  <div id="stage">
    <div id="board">
      <canvas id="cv" aria-label="벽돌깨기 게임 화면"></canvas>
      <div id="ov"></div>
    </div>
  </div>
  <footer id="slots" aria-label="능력 슬롯"></footer>
</div>

<script>
(()=>{
'use strict';
/* ---------- constants ---------- */
const W=360,H=640,CX=180,CY=590,LINE=548,COLS=8,CW=W/COLS,ROW=32,BH=ROW-4;
const R=5,MAXBALLS=60,MAXHP=5,SLOTS=4,MAXA=1.35,DPR=2,BALL_SP=380;
const TIER=['#6c8cff','#8f7cff','#c36cff','#ff6cc3','#ff7a6c','#ffa84d'];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov'),stage=$('stage');
cv.width=W*DPR;cv.height=H*DPR;
const cs=getComputedStyle(document.documentElement);
const C=n=>cs.getPropertyValue(n).trim();
const col={bg:C('--bg'),line:C('--line'),fg:C('--fg'),muted:C('--muted'),mint:C('--mint'),danger:C('--danger'),ink:C('--ink'),accent:C('--accent')};

/* ---------- abilities ---------- */
const AB={
  split:{n:'분열',c:'#5eead4',d:['벽돌을 5번 맞힐 때마다 공이 1개 복제돼요','벽돌을 4번 맞힐 때마다 공이 1개 복제돼요','벽돌을 3번 맞힐 때마다 공이 2개 복제돼요']},
  burn:{n:'불꽃',c:'#ff9a5c',d:['맞힌 벽돌이 3초 동안 초당 1 피해를 입어요','맞힌 벽돌이 3초 동안 초당 2 피해를 입어요','맞힌 벽돌이 4초 동안 초당 3 피해를 입어요']},
  bolt:{n:'번개',c:'#ffe066',d:['25% 확률로 근처 벽돌 1개에 번개가 튀어요','40% 확률로 근처 벽돌 2개에 번개가 튀어요','55% 확률로 근처 벽돌 3개에 번개가 튀어요']},
  pierce:{n:'관통',c:'#c9a7ff',d:['25% 확률로 벽돌을 뚫고 지나가요','45% 확률로 벽돌을 뚫고 지나가요','65% 확률로 벽돌을 뚫고 지나가요']},
  rapid:{n:'연사',c:'#74a7ff',d:['발사 속도 +25%','발사 속도 +60%','발사 속도 +110%']},
  power:{n:'강타',c:'#ff7a8a',d:['공 피해 +1','공 피해 +2','공 피해 +3']},
  chill:{n:'냉기',c:'#bfeaff',d:['맞힌 벽돌이 3초 동안 받는 피해 +40%','맞힌 벽돌이 3초 동안 받는 피해 +70%','맞힌 벽돌이 3초 동안 받는 피해 +100%']}
};
const P={
  split:{every:[5,4,3],n:[1,1,2]},
  burn:{dps:[1,2,3],dur:[3,3,4]},
  bolt:{p:[.25,.4,.55],k:[1,2,3]},
  pierce:{p:[.25,.45,.65]},
  rapid:{mul:[1.25,1.6,2.1]},
  power:{add:[1,2,3]},
  chill:{bonus:[.4,.7,1],dur:[3,3,3]}
};
const lvl=id=>G.ab[id]||0;
const pv=(id,k)=>P[id][k][lvl(id)-1];

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=()=>Math.random();
const xpNeed=l=>Math.round(8*Math.pow(1.38,l-1));
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const tier=hp=>hp<4?0:hp<8?1:hp<13?2:hp<20?3:hp<30?4:5;

/* ---------- state ---------- */
let G,aim=0,angle=0;
const keys={left:false,right:false};

function reset(){
  G={state:'title',t:0,lv:1,xp:0,need:xpNeed(1),hp:MAXHP,kills:0,
     balls:[],bricks:[],parts:[],arcs:[],ab:{},order:[],fireT:0,rowN:0,topY:8,
     pending:0,choices:null,first:false,flash:0,overAt:0};
  for(let i=4;i>=0;i--)spawnRow(8+i*ROW);
}

function spawnRow(y){
  const n=G.rowN++,base=2+n*.42;
  const cols=[];
  for(let c=0;c<COLS;c++)if(rnd()<.62)cols.push(c);
  while(cols.length<3){const c=(rnd()*COLS)|0;if(!cols.includes(c))cols.push(c);}
  for(const c of cols){
    const hp=Math.max(1,Math.round(base*(.7+rnd()*.7)));
    G.bricks.push({x:c*CW+2,y,w:CW-4,h:BH,hp,max:hp,row:n,flash:0,burn:0,burnDps:0,burnAcc:0,chill:0,dead:false});
  }
}

/* ---------- combat ---------- */
function spawnBall(x,y,dx,dy,clone){
  G.balls.push({x,y,vx:dx*BALL_SP,vy:dy*BALL_SP,sp:BALL_SP,clone,hits:0,inside:new Set(),dead:false});
}
function fire(){
  if(G.balls.length>=MAXBALLS)return;
  const a=angle+(rnd()-.5)*.04;
  spawnBall(CX+Math.sin(a)*26,CY-Math.cos(a)*26,Math.sin(a),-Math.cos(a),false);
}
function fix(b){
  const m=b.sp*.24;
  if(Math.abs(b.vy)<m){
    b.vy=(b.vy<0?-1:1)*m;
    b.vx=(b.vx<0?-1:1)*Math.sqrt(b.sp*b.sp-b.vy*b.vy);
  }
}
function split(b,n){
  for(let i=0;i<n&&G.balls.length<MAXBALLS;i++){
    const a=Math.atan2(b.vx,-b.vy)+(n===1?(rnd()<.5?-1:1)*(.35+rnd()*.4):(i===0?-1:1)*(.35+rnd()*.4));
    spawnBall(b.x,b.y,Math.sin(a),-Math.cos(a),true);
  }
}
function hurt(br,d){
  if(br.dead)return;
  br.hp-=d;br.flash=.1;
  if(br.hp<=0)kill(br);
}
function kill(br){
  br.dead=true;G.kills++;
  gainXp(Math.max(1,Math.round(br.max*.35)));
  if(G.parts.length<200){
    const cx=br.x+br.w/2,cy=br.y+br.h/2,c=TIER[tier(br.max)];
    for(let i=0;i<6;i++)G.parts.push({x:cx,y:cy,vx:rnd()*160-80,vy:rnd()*160-100,life:.45,c});
  }
}
function bolt(from,k,d){
  const fx=from.x+from.w/2,fy=from.y+from.h/2;
  const near=G.bricks.filter(b=>!b.dead&&b!==from)
    .map(b=>({b,d:Math.hypot(b.x+b.w/2-fx,b.y+b.h/2-fy)})).filter(o=>o.d<110)
    .sort((a,b)=>a.d-b.d).slice(0,k);
  for(const o of near){
    G.arcs.push({x1:fx,y1:fy,x2:o.b.x+o.b.w/2,y2:o.b.y+o.b.h/2,life:.14});
    hurt(o.b,Math.max(1,d*.5));
  }
}
function onHit(ball,br){
  const base=1+(lvl('power')?pv('power','add'):0);
  let dmg=ball.clone?Math.max(1,base*.6):base;
  if(br.chill>0&&lvl('chill'))dmg*=1+pv('chill','bonus');
  hurt(br,dmg);
  if(lvl('burn')){br.burn=pv('burn','dur');br.burnDps=pv('burn','dps');}
  if(lvl('chill'))br.chill=pv('chill','dur');
  if(lvl('bolt')&&rnd()<pv('bolt','p'))bolt(br,pv('bolt','k'),dmg);
  if(lvl('split')&&!ball.clone){
    ball.hits++;
    if(ball.hits>=pv('split','every')){ball.hits=0;split(ball,pv('split','n'));}
  }
}
function stepBall(b,dt){
  const n=Math.max(1,Math.ceil(b.sp*dt/3)),h=dt/n,r=b.clone?4:R;
  for(let s=0;s<n&&!b.dead;s++){
    b.x+=b.vx*h;b.y+=b.vy*h;
    if(b.x<r){b.x=r;b.vx=Math.abs(b.vx);fix(b);}
    else if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx);fix(b);}
    if(b.y<r){b.y=r;b.vy=Math.abs(b.vy);fix(b);}
    for(const br of G.bricks){
      if(br.dead)continue;
      const cx=clamp(b.x,br.x,br.x+br.w),cy=clamp(b.y,br.y,br.y+br.h);
      const dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
      if(d2>=r*r){b.inside.delete(br);continue;}
      if(b.inside.has(br))continue;
      onHit(b,br);
      if(lvl('pierce')&&rnd()<pv('pierce','p')){b.inside.add(br);continue;}
      let nx,ny;
      if(d2>1e-6){const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;b.x=cx+nx*r;b.y=cy+ny*r;}
      else{
        const l=b.x-br.x,rr=br.x+br.w-b.x,t=b.y-br.y,bt=br.y+br.h-b.y,m=Math.min(l,rr,t,bt);
        if(m===t){nx=0;ny=-1;b.y=br.y-r;}
        else if(m===bt){nx=0;ny=1;b.y=br.y+br.h+r;}
        else if(m===l){nx=-1;ny=0;b.x=br.x-r;}
        else{nx=1;ny=0;b.x=br.x+br.w+r;}
      }
      const dot=b.vx*nx+b.vy*ny;
      if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
      fix(b);
      break;
    }
  }
  if(b.y>H+10)b.dead=true;
}

/* ---------- leveling ---------- */
function gainXp(n){
  G.xp+=n;
  while(G.xp>=G.need){G.xp-=G.need;G.lv++;G.need=xpNeed(G.lv);G.pending++;}
}
function makeChoices(first){
  const pool=[];
  for(const id in AB){
    const l=lvl(id);
    if(l>0&&l<3)pool.push({id,kind:'up',to:l+1});
    else if(l===0&&G.order.length<SLOTS)pool.push({id,kind:'new',to:1});
  }
  for(let i=pool.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  const out=pool.slice(0,3);
  if(out.length&&out.length<3&&!first)out.push({id:'heal',kind:'heal'});
  return out;
}
function openChoices(first){
  const ch=makeChoices(first);
  if(!first&&!ch.length){
    /* every slot is maxed: nothing to pick, so a level-up just repairs one HP */
    G.pending--;G.hp=Math.min(MAXHP,G.hp+1);hud();
    if(G.pending>0)openChoices(false);
    return;
  }
  G.state='choose';G.first=!!first;G.choices=ch;
  const cards=G.choices.map((c,i)=>{
    if(c.id==='heal')return `<button class="card" data-i="${i}"><span class="chip" style="background:var(--danger)">+</span><span class="t">수리<em>HP +1</em></span><span class="d">무너진 방어선을 고쳐요 (최대 ${MAXHP})</span></button>`;
    const a=AB[c.id];
    return `<button class="card" data-i="${i}"><span class="chip" style="background:${a.c}">${a.n[0]}</span><span class="t">${a.n}<em>${c.kind==='new'?'새 능력':'Lv '+(c.to-1)+' → '+c.to}</em></span><span class="d">${a.d[c.to-1]}</span></button>`;
  }).join('');
  show(`<h2>${first?'첫 능력을 고르세요':'레벨 업!'}</h2><div class="cards">${cards}</div><p class="hint">숫자키 1·2·3으로도 고를 수 있어요</p>`);
}
function pick(i){
  if(G.state!=='choose')return;
  const c=G.choices[i];if(!c)return;
  if(c.id==='heal')G.hp=Math.min(MAXHP,G.hp+1);
  else if(c.kind==='new'){G.ab[c.id]=1;G.order.push(c.id);}
  else G.ab[c.id]++;
  if(!G.first)G.pending--;
  G.choices=null;hud();
  G.state='play';hide();
  if(G.pending>0)openChoices(false);
}

/* ---------- flow ---------- */
function breach(row){
  G.bricks=G.bricks.filter(b=>b.row!==row);
  G.hp--;G.flash=.35;hud();
  if(G.hp<=0)over();
}
function over(){
  G.state='over';G.overAt=performance.now();
  show(`<h1>게임 오버</h1><p class="stat">Lv ${G.lv} · 벽돌 ${G.kills}개 · ${fmt(G.t)}</p><button class="btn" id="again">다시 하기</button>`);
  $('again').onclick=()=>{if(performance.now()-G.overAt>600)start();};
}
function showTitle(){
  show(`<h1>회전포 벽돌깨기</h1><p class="sub">마우스나 손가락으로 방향을 잡으면<br>포가 돌아가며 공을 쏩니다.<br>(키보드는 ← →)<br><br>내려오는 벽돌을 부수고 레벨을 올려<br>능력 슬롯 4칸을 채우세요.<br>벽돌이 아래 선에 닿으면 HP가 줄어요.</p><button class="btn" id="go">시작</button>`);
  $('go').onclick=start;
}
function start(){reset();hud();openChoices(true);}
function show(html){ov.innerHTML=html;ov.hidden=false;const b=ov.querySelector('button');if(b)b.focus({preventScroll:true});}
function hide(){ov.hidden=true;ov.innerHTML='';}

/* ---------- update ---------- */
function update(dt){
  G.flash=Math.max(0,G.flash-dt);
  if(G.state!=='play')return;
  G.t+=dt;
  const kd=(keys.right?1:0)-(keys.left?1:0);
  if(kd)aim=clamp(aim+kd*2.2*dt,-MAXA,MAXA);
  angle+=(aim-angle)*Math.min(1,dt*20);

  G.fireT-=dt;
  const iv=.42/(lvl('rapid')?pv('rapid','mul'):1);
  while(G.fireT<=0){fire();G.fireT+=iv;}

  const dy=Math.min(60,12+G.t*.11)*dt;
  for(const b of G.bricks)b.y+=dy;
  G.topY+=dy;
  while(G.topY>0){const ny=G.topY-ROW;spawnRow(ny);G.topY=ny;}

  for(const b of G.bricks){
    if(b.dead)continue;
    b.flash=Math.max(0,b.flash-dt);
    if(b.chill>0)b.chill-=dt;
    if(b.burn>0){
      b.burn-=dt;b.burnAcc+=b.burnDps*dt;
      if(b.burnAcc>=1){const d=Math.floor(b.burnAcc);b.burnAcc-=d;hurt(b,d);}
    }
  }
  for(let i=0;i<G.balls.length;i++)stepBall(G.balls[i],dt);
  G.balls=G.balls.filter(b=>!b.dead);
  G.bricks=G.bricks.filter(b=>!b.dead);

  for(const b of G.bricks)if(b.y+b.h>=LINE){breach(b.row);break;}

  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const a of G.arcs)a.life-=dt;
  G.arcs=G.arcs.filter(a=>a.life>0);

  if(G.state==='play'&&G.pending>0)openChoices(false);
}

/* ---------- draw ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);

  const g=ctx.createLinearGradient(0,LINE,0,H);
  g.addColorStop(0,'rgba(255,107,129,.12)');g.addColorStop(1,'rgba(255,107,129,.02)');
  ctx.fillStyle=g;ctx.fillRect(0,LINE,W,H-LINE);
  ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,107,129,.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,LINE+.5);ctx.lineTo(W,LINE+.5);ctx.stroke();ctx.restore();

  ctx.font='bold 13px "Noto Sans KR",system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of G.bricks){
    rr(b.x,b.y,b.w,b.h,5);
    ctx.fillStyle=TIER[tier(b.hp)];ctx.fill();
    if(b.chill>0){ctx.fillStyle='rgba(191,234,255,.4)';ctx.fill();}
    if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+(b.flash*6).toFixed(2)+')';ctx.fill();}
    if(b.burn>0){ctx.strokeStyle='#ff9a5c';ctx.lineWidth=2;ctx.stroke();}
    ctx.fillStyle=col.ink;
    ctx.fillText(Math.ceil(b.hp),b.x+b.w/2,b.y+b.h/2+1);
  }

  ctx.lineWidth=2;
  for(const a of G.arcs){
    ctx.strokeStyle='rgba(255,224,102,'+(a.life/.14).toFixed(2)+')';
    ctx.beginPath();ctx.moveTo(a.x1,a.y1);
    ctx.lineTo((a.x1+a.x2)/2+(rnd()-.5)*10,(a.y1+a.y2)/2+(rnd()-.5)*10);
    ctx.lineTo(a.x2,a.y2);ctx.stroke();
  }
  for(const b of G.balls){
    ctx.fillStyle=b.clone?'rgba(255,243,214,.7)':'#fff3d6';
    ctx.beginPath();ctx.arc(b.x,b.y,b.clone?4:R,0,7);ctx.fill();
  }
  for(const p of G.parts){
    ctx.globalAlpha=clamp(p.life/.45,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  /* aim guide */
  ctx.save();ctx.setLineDash([2,7]);ctx.strokeStyle='rgba(255,243,214,.35)';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(CX+Math.sin(angle)*34,CY-Math.cos(angle)*34);
  ctx.lineTo(CX+Math.sin(angle)*130,CY-Math.cos(angle)*130);
  ctx.stroke();ctx.restore();

  /* turret */
  ctx.save();ctx.translate(CX,CY);ctx.rotate(angle);
  ctx.fillStyle=col.fg;rr(-5,-31,10,25,3);ctx.fill();
  ctx.restore();
  ctx.fillStyle=col.mint;ctx.beginPath();ctx.arc(CX,CY,16,0,7);ctx.fill();
  ctx.fillStyle=col.ink;ctx.beginPath();ctx.arc(CX,CY,6,0,7);ctx.fill();
  ctx.fillStyle=col.mint;ctx.beginPath();ctx.arc(CX,CY,2.5,0,7);ctx.fill();

  ctx.font='12px "Noto Sans KR",system-ui,sans-serif';ctx.fillStyle=col.muted;
  ctx.textAlign='left';ctx.fillText(fmt(G.t),10,H-14);
  ctx.textAlign='right';ctx.fillText('벽돌 '+G.kills,W-10,H-14);

  if(G.flash>0){ctx.fillStyle='rgba(255,107,129,'+(G.flash*.9).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- hud ---------- */
let lastXp=-1;
function hud(){
  lastXp=-1;
  $('lv').textContent=G.lv;
  let h='';for(let i=0;i<MAXHP;i++)h+='<b'+(i<G.hp?'':' class="off"')+'></b>';
  $('hp').innerHTML=h;
  let s='';
  for(let i=0;i<SLOTS;i++){
    const id=G.order[i];
    if(!id){s+='<div class="slot empty"><span class="n">빈 슬롯</span></div>';continue;}
    const a=AB[id],l=G.ab[id];
    s+=`<div class="slot" style="--c:${a.c}"><span class="n">${a.n}</span><span class="pips">${[1,2,3].map(k=>'<i'+(k<=l?' class="on"':'')+'></i>').join('')}</span></div>`;
  }
  $('slots').innerHTML=s;
}
function hudFrame(){
  const w=(G.xp/G.need*100).toFixed(1);
  if(w!==lastXp){lastXp=w;$('xpb').style.width=w+'%';$('lv').textContent=G.lv;}
}

/* ---------- input ---------- */
function aimAt(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  aim=clamp(Math.atan2(x-CX,Math.max(CY-y,12)),-MAXA,MAXA);
}
addEventListener('pointermove',aimAt);
$('board').addEventListener('pointerdown',aimAt);
ov.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(+c.dataset.i);});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;if(G.state==='play')e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;if(G.state==='play')e.preventDefault();}
  else if(G.state==='choose'&&/^Digit[1-3]$/.test(e.code))pick(+e.code[5]-1);
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
addEventListener('blur',()=>{keys.left=keys.right=false;});

/* ---------- layout ---------- */
function fit(){
  const r=stage.getBoundingClientRect();
  const bw=Math.max(200,Math.floor(Math.min(r.width,r.height*W/H)));
  const root=document.documentElement.style;
  root.setProperty('--bw',bw+'px');root.setProperty('--bh',Math.floor(bw*H/W)+'px');
}
new ResizeObserver(fit).observe(stage);addEventListener('resize',fit);

/* ---------- boot ---------- */
reset();hud();showTitle();fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);hudFrame();draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__g={get G(){return G;},update,pick,hud,setAim:a=>{aim=clamp(a,-MAXA,MAXA);angle=aim;},start};
})();
</script>
